name: Trigger Profile Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Wait website to be updated
      run: sleep 180  # wait for website to be up-to-date
    - name: Trigger workflow
      # Replaces the archived convictional/trigger-workflow-and-wait action with the
      # GitHub CLI: dispatch blog-post.yml in shenxianpeng/shenxianpeng, wait for that
      # run to finish and fail this job if it did not succeed (same behaviour as before).
      env:
        GH_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
      run: |
        repo=shenxianpeng/shenxianpeng
        workflow=blog-post.yml
        latest_run() {
          gh run list --repo "$repo" --workflow "$workflow" --event workflow_dispatch \
            --limit 1 --json databaseId --jq '.[0].databaseId'
        }
        before=$(latest_run)
        gh workflow run "$workflow" --repo "$repo" --ref master
        run_id="$before"
        for _ in $(seq 1 30); do
          sleep 10
          run_id=$(latest_run)
          if [ -n "$run_id" ] && [ "$run_id" != "$before" ]; then
            break
          fi
        done
        if [ -z "$run_id" ] || [ "$run_id" = "$before" ]; then
          echo "::error::$workflow in $repo did not start within 5 minutes"
          exit 1
        fi
        echo "Waiting for https://github.com/$repo/actions/runs/$run_id"
        gh run watch "$run_id" --repo "$repo" --interval 10 --exit-status
