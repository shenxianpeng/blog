# Build the site with MkDocs NG and the Sumi theme, and deploy it to GitHub Pages
name: Deploy site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site-requirements.txt
      - name: Install MkDocs NG and Sumi
        run: pip install -r site-requirements.txt
      - name: Build
        # hooks/site.py also writes the old addresses (/en/…, Chinese pages at
        # the root, /categories/…) as redirects, and copies the English feed
        # to /en/index.xml.
        run: mkdocs build --site-dir public
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }}
          external_repository: shenxianpeng/shenxianpeng.github.io
          publish_branch: master
          publish_dir: ./public
          keep_files: false
          # Replace master with a single commit on every deploy. Appending
          # commits kept a full copy of the site per deploy: 731 commits and
          # 588 MB by 2026-10, none of which Pages ever serves.
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: "Site updated"
