# This workflow validates delivery artifacts against Open Delivery Spec.
# Submitted via PR from https://github.com/open-delivery-spec
#
# Targets master (default branch of shenxianpeng/shenxianpeng.github.io).

name: ODS Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout
      pull-requests: write  # post the ODS report comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: ODS AI code quality gate
        uses: open-delivery-spec/validate-action@7bff56e84b5e8a287ce9c597ff33896b869c1253 # v0.2.12
        with:
          diff-base: ${{ github.event.pull_request.base.sha || 'origin/master' }}
          branch: ${{ github.head_ref }}
          summary: 'true'
          comment: 'true'
