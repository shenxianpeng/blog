# -- Markup --
# These settings are required for the theme to function.

[goldmark]
  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

  # Blowfish 3 renders every image as a <figure>; without this Goldmark wraps a
  # standalone image in <p>, which is invalid HTML.
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
    [goldmark.parser.attribute]
      block = true
      title = true

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4
