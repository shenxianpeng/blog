# Deploy previews only; production is GitHub Pages (.github/workflows/pages.yaml).
# Keep HUGO_VERSION in step with that workflow: Blowfish 3 needs Hugo 0.162-0.165.
[build.environment]
  HUGO_VERSION = "0.165.0"
  # Production builds with `hugo --minify`; minify previews too, so whitespace
  # that the minifier collapses shows up here and not only after the merge.
  HUGO_MINIFY_MINIFYOUTPUT = "true"
